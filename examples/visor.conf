# Visor's settings. Copy to ~/.config/visor/visor.conf and fill in.
#
# This file is an example. The real one names your projects and your account,
# so it stays on the server and out of this public repository. Every setting
# shown with its default is optional: leave it out to keep the default. The
# ones you must set are marked REQUIRED.
#
# Sections:  [visor]    where the notes are, which models, what the agent may do
#            [media]    transcription, speech, image and pose tools
#
# The models are not here: each is a note in the notes' models/ folder (see
# models_folder below), and the projects are made from notes.


# ── [visor]: the notes, the models, and what a run may do ────────────────────

[visor]

# The notes folder, REQUIRED. Visor expects these folders inside it:
#   inbox/      notes for visor, new ones and ones you have replied to
#   working/    the note visor is on now; drag it out to stop the run
#   output/     visor has replied, in a folder for each kind of note; reply under
#               "## Your reply" and move it back to inbox/ to carry on. A note
#               visor could not run says at its top what to fix.
#   scheduled/, idle/  notes that say Repeat: (a schedule) or Repeat: idle, between runs
# Visor makes these folders itself when they are missing.
# Beside them visor keeps STATUS.md (what is running, and the queue), VISOR.md
# (this server's version, health and settings), samples/ (a sample note for each
# kind of note: how to write it, and what this server has), logs/ (a live log per
# note), media/ (what the image, speech and pose jobs make, a folder per note), projects/ (each
# project's config.md, and folder projects), characters/ (who a chat can be
# with), games/ and models/ (the models, below).
tasks = /srv/notes/tasks

# The models visor may use: one note each, kept in your notes so that which
# models a server has, and what you think of them, stay yours. A note says
# `Kind: language` (with `Ollama:`, the model's name in Ollama) or
# `Kind: image` (with `File:`, under comfy_models), and how to run it. An empty
# folder is given starter notes: one small model of each kind, with `Fetch: no`
# until you say yes in the note. Visor writes each note back in
# its standard form, with what it found on this server.
# models_folder = /srv/notes/tasks/models
# Where Ollama answers: visor, the ollama program it runs, and every run's model
# door all use this address.
# ollama = 127.0.0.1:11434

# VISOR.md, beside STATUS.md, shows and changes default_model, review, reviewer,
# live_log_every and self_update, and the waits: how long visor rests between
# passes, how long a note must settle, and the like. The values here are where it
# starts. Once one is changed there, the note's value is kept (in the state
# folder) and this line is no longer read. Paths and anything secret stay here.

# The model for a note with no Model: line: a language model's name. Left out,
# or naming none visor has, the first language model by name. A project can set
# its own in its config.md.
default_model = small


# How a run may reach out, and how long it may go.

# The VPN tunnel's proxy on this machine (see examples/wireproxy.conf). It carries
# what runs fetch and the image models visor fetches. Language models are pulled
# by Ollama itself, a GitHub project is cloned and visor updates itself all
# directly, from the server's own address: none of those is an agent's doing. A note
# with "Web: yes" gets the internet through this and through nothing else: the
# agent's commands cannot reach the network, only the net door can, and the
# door leads only into the tunnel. While the tunnel is down, such a note comes
# back unrun. Every connection the agent makes is listed in its reply.
vpn_proxy = 127.0.0.1:25344

# Your forum for AI agents, reached the same way: through the tunnel, by a door
# that passes only the forum's own reading and posting calls. A note with
# "Chan: Read" lets the agent read, search and wait for replies; "Chan: All"
# lets it also start threads, reply and report, in the same run. Posts go out
# at once. Leave chan_host empty and no run gets the board.
chan_host = your-forum.example
# Words kept out of anything posted, one per line: replaced by [redacted].
# Your account names belong here. The file stays on the server.
chan_redact = /home/YOU/.config/visor/chan-redact
# One secret per model, and one per character, made by visor the first time
# that model or character posts: a line each, `qwen3:8b <secret>` or
# `character:Mara Lee <secret>`. The forum shows a hash of it as the poster's
# handle, so their posts are recognisably their own across runs. The agent
# never sees the file.
chan_tripcodes = /home/YOU/.config/visor/chan-tripcodes


# After a run.

# After each build, a read-only round on its branch reviews it against the
# task, and the review is added to the note. It is an agent's review: compared
# with a person's on five builds, it caught missing functions and failing tests
# but not features nobody would see. Read it as a second opinion.
review = no
# The model that reviews: a language model's name.
# Left out, or naming no model, the default model reviews.
reviewer = small


# Projects made from a note ("New project: <name>", with "GitHub: no", "yes"
# or "owner/repo").

# Where a folder project's folder is made.
projects_folder = /srv/notes/tasks/projects
# Where a GitHub project is cloned, as <repos>/<name>.
repos = /srv/code
# "GitHub: yes" clones this account's repository of the project's name.
github_owner = your-github-name
# How a repository is reached; {repo} is owner/name. The default uses the SSH
# key this account already has for GitHub.
github_url = git@github.com:{repo}.git
# The one list of projects, which visor writes. A project is made by a
# "New project:" note and changed through the config.md in its folder under
# projects_folder, never in this file.
projects_list = /home/YOU/.config/visor/projects.conf


# Where things go. The defaults suit the usual server layout.

# Each run's folder of evidence: its report, its logs, every call to the model.
results = /srv/code/results
# Each run's working copy of its project. A run's two folders are deleted a day
# after no note in the notes folder claims the run any more.
work = /srv/code/work
# Each folder project's history, a git repository visor keeps outside the folder,
# which its runs work from.
# folders = /srv/code/folders
# Live logs, one file per note and model, and what the media jobs make.
logs = /srv/notes/tasks/logs
media_folder = /srv/notes/tasks/media
# Games, a folder each: the story note, its memory, its cards and its media.
# games_folder = /srv/notes/tasks/games
# Opera games, a folder each: the game's page, its maps, its talk and its history.
# opera_folder = /srv/notes/tasks/opera
# The Python with Opera's rules engine, the `diplomacy` package, which install.sh puts in an environment
# of its own (by default under [media] tools). Visor runs it apart, walled like the media tools.
# opera_python = /srv/code/tools/opera-venv/bin/python
# The sample notes, one for each kind of note, ready to copy into inbox/.
# samples_folder = /srv/notes/tasks/samples
# How often, in seconds, a live log is brought up to date.
live_log_every = 60

# Pull this repository while idle, reinstall, and restart when it changed.
# VISOR.md's Auto-update. Left out, it is yes. With it off, visor still looks for
# new commits, and VISOR.md lists them, with an Update now box.
# On, this server runs whatever lands on the branch it follows, unseen by you.
self_update = yes
# The program that runs one round. Only tests change this.
# runner = /home/YOU/obsidian-visor/visor-run.sh


# ── [media]: transcription, speech, images and poses ─────────────────────────
#
# These run with no network, each walled in, seeing only its own program, its
# models and the job's scratch folder. The paths below are the defaults under
# `tools`; set only the ones that differ.

[media]

# Where the tools are installed.
tools = /srv/code/tools

# Transcription: whisper.cpp with the large-v3-turbo model. Notes: "Transcribe:"
# with a recording attached; "Language: en" to name the language.
# whisper = /srv/code/tools/whisper.cpp/build/bin/whisper-cli
# whisper_dir = /srv/code/tools/whisper.cpp
# whisper_model = /srv/code/tools/models/ggml-large-v3-turbo.bin

# Speech: Kokoro. Notes: "Speak:" with text below or a note embedded; "Voice:"
# and "Speed:". The voices on this server are listed in sample-speak.md.
# kokoro_python = /srv/code/tools/kokoro-venv/bin/python
# kokoro_model = /srv/code/tools/models/kokoro-v1.0.onnx
# kokoro_voices = /srv/code/tools/models/voices-v1.0.bin

# Images: ComfyUI, started for each job with every add-on disabled, drawing
# from workflows visor builds itself. Notes: "Image: <prompt>", with "Model:",
# "Size:", "Count:", "Seed:", "Negative:", "Quality: full"; "Pose:" with a
# skeleton, "Pose from:" with a photograph; "Fix: hands" and "Finish: yes" for
# improved copies. The image models are notes in models_folder, listed with
# what this server has in sample-image.md; their files live under comfy_models
# in ComfyUI's folder layout.
# comfyui = /srv/code/tools/ComfyUI
# comfy_python = /srv/code/tools/comfy-venv/bin/python
# comfy_models = /srv/code/tools/models/comfy

# Poses: rtmlib, tracing the people in a photograph into a skeleton for the
# pose controls. Notes: "Skeleton:", or "Pose from:" on an Image note.
# pose_python = /srv/code/tools/pose-venv/bin/python
# pose_detector = /srv/code/tools/models/pose/yolox_m_humanart.onnx
# pose_model = /srv/code/tools/models/pose/rtmw-x-l_384x288.onnx

# Processor threads a tool may use.
threads = 16
# The longest a media job may take, in minutes.
minutes = 360
# Where a job's scratch folder goes while it runs. A failed job's folder is kept
# there for diagnosis; the note says where.
# work = /home/YOU/.local/state/visor/media
# sandbox = no runs the tools unwalled. For tests only.
